<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Geometric SVG Art</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #f4f5f7;
    }
    svg {
      background: #f8f7f2;
      border: 4px solid #174f38;
    }
  </style>
</head>
<body>

  <svg width="200" height="300" viewBox="0 0 200 300" xmlns="http://www.w3.org/2000/svg">
    <!-- Rectangle (Sky & Base) -->
    <rect x="20" y="20" width="160" height="120" fill="#174f38" />
    <rect x="20" y="255" width="160" height="25" fill="#fa9284" />

    <!-- Line (Horizon & Rays) -->
    <line x1="20" y1="140" x2="180" y2="140" stroke="#fbc62d" stroke-width="4" />
    <line x1="100" y1="30" x2="100" y2="130" stroke="#65b447" stroke-width="2" />

    <!-- Circle (Sun) -->
    <circle cx="100" cy="80" r="28" fill="#fbc62d" />

    <!-- Ellipse (Orbit Ring) -->
    <ellipse cx="100" cy="80" rx="55" ry="18" fill="none" stroke="#fa9284" stroke-width="3" />

    <!-- Polygon (Mountain) -->
    <polygon points="20,220 100,145 180,220" fill="#65b447" />

    <!-- Polyline (Wave) -->
    <polyline points="20,240 60,225 100,240 140,225 180,240" fill="none" stroke="#174f38" stroke-width="5" />
  </svg>

</body>
</html>
